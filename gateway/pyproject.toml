[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cube-gateway"
version = "1.0.0"
description = "CUBE Gateway: local-first smart home discovery, provisioning and control for the CUBE OS app"
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "websockets>=13",
  "pydantic>=2.9",
  "httpx>=0.27",
  "cryptography>=43",
  "zeroconf>=0.136",
  "python-kasa>=0.10",
  "tinytuya>=1.16",
  "aiowebostv>=0.6",
  "samsungtvws[async]>=2.7",
  "aiomqtt>=2.3",
  "qrcode>=8",
  "dbus-fast>=2.24",
  "msmart-ng>=2026.9.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7"]

[project.scripts]
cube-gateway = "cube_gateway.cli:main"

[tool.setuptools.packages.find]
include = ["cube_gateway*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:tinytuya.*"]

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S"]
# E501: long lines are allowed past line-length where wrapping hurts readability.
# ASYNC109: timeouts are explicit parameters by design (registry.guard, discovery).
ignore = ["S101", "S104", "B008", "S311", "E501", "ASYNC109", "ASYNC110", "UP047", "B027", "S110", "S112"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107", "S108"]
# Field names such as password_rule, and the published default setup-network passwords of specific models.
"cube_gateway/models.py" = ["S105"]
"cube_gateway/provisioning/*" = ["S105", "S106"]
