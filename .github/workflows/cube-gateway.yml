name: CUBE Gateway

# Tests the gateway, builds the single Docker image for linux/amd64 and linux/arm64, and publishes it to
# GitHub Container Registry as ghcr.io/<owner>/cube-os-gateway:
#   - every push to Master: :latest and :sha-<commit>
#   - a tag gateway-v1.2.3: :1.2.3, :1.2 and :latest
#   - pull requests: build and test only, nothing is pushed
# Publishing uses the workflow's own GITHUB_TOKEN (packages: write); no extra secret is needed.

on:
  push:
    branches: [Master]
    tags: ["gateway-v*"]
    paths: ["gateway/**", ".github/workflows/cube-gateway.yml"]
  pull_request:
    paths: ["gateway/**", ".github/workflows/cube-gateway.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cube-gateway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: gateway/pyproject.toml
      - run: pip install -e '.[test]'
      - run: ruff check cube_gateway tests
      - run: pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name (registry paths must be lowercase)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cube-os-gateway" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: "Smoke test (amd64): first start, health, restart with retained data"
        run: |
          docker buildx build --load -t cube-os-gateway:ci gateway
          docker run -d --name gw --network host -e CUBE_PORT=18686 -e CUBE_MDNS_ADVERTISE=0 -v gw-data:/data cube-os-gateway:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:18686/api/v1/health && break; sleep 1; done
          code=$(docker exec gw cube-gateway setup-code | head -1 | awk '{print $3}')
          token=$(curl -sf -X POST http://127.0.0.1:18686/api/v1/auth/claim -H 'Content-Type: application/json' \
            -d "{\"setup_code\":\"$code\",\"client_name\":\"ci\"}" | python3 -c 'import sys,json; print(json.load(sys.stdin)["data"]["token"])')
          curl -sf -X POST http://127.0.0.1:18686/api/v1/rooms -H "Authorization: Bearer $token" -H 'Content-Type: application/json' -d '{"name":"CI"}'
          docker restart gw
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:18686/api/v1/health && break; sleep 1; done
          curl -sf http://127.0.0.1:18686/api/v1/rooms -H "Authorization: Bearer $token" | grep -q '"CI"'
          until [ "$(docker inspect --format '{{.State.Health.Status}}' gw)" != "starting" ]; do sleep 2; done
          test "$(docker inspect --format '{{.State.Health.Status}}' gw)" = healthy
          docker rm -f gw

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/Master' || startsWith(github.ref, 'refs/tags/gateway-v') }}
            type=match,pattern=gateway-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=gateway-v(\d+\.\d+)\.\d+,group=1
            type=sha,prefix=sha-

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: gateway
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
